name: Build and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-apk:
    name: Android APK (native notifications)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Generate launcher icons
        run: python3 app/src/gen_icons.py

      - name: Build APK
        run: |
          ANDROID_BT="$ANDROID_SDK_ROOT/build-tools/34.0.0" \
          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-34/android.jar" \
          bash app/src/build.sh

      - name: Commit rebuilt APK (once)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/eft-app.apk.b64
          if git diff --cached --quiet; then
            echo "APK unchanged — nothing to commit."
          else
            git commit -m "rebuild APK from app/src (v$(cat VERSION)) [skip ci]"
            git push
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (fresh main, so the image bundles the APK
              # the build-apk job just committed)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read version
        run: echo "APP_VERSION=v$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (lowercase image name)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.APP_VERSION }}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub release (if new version)
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - name: Checkout (fresh main, includes the APK the build-apk
              # job just committed)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(cat VERSION)"
          if gh release view "$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — skipping."
            exit 0
          fi
          gh release create "$VERSION" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Release $VERSION" \
            --notes-file RELEASE_NOTES.md
