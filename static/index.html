<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emergency Food Storage</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --text: #1c2733; --muted: #68788a;
    --accent: #2563eb; --ok: #16a34a; --warn6: #eab308; --warn3: #f97316;
    --warn1: #dc2626; --expired: #7f1d1d; --border: #dde3ea;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
         margin: 0; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .9rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
          gap: 20px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
          padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card h2 { font-size: 1.05rem; margin: 0 0 14px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select, button { font: inherit; padding: 8px 10px; border-radius: 8px;
          border: 1px solid var(--border); background: #fff; }
  input { flex: 1; min-width: 110px; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer;
           padding: 8px 16px; }
  button:hover { filter: brightness(1.08); }
  .msg { min-height: 20px; font-size: .85rem; margin-top: 8px; }
  .msg.error { color: var(--warn1); }
  .msg.ok { color: var(--ok); }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px;
           font-size: .75rem; font-weight: 600; color: #fff; }
  .lvl-ok { background: var(--ok); }
  .lvl-6months { background: var(--warn6); color: #422006; }
  .lvl-3months { background: var(--warn3); }
  .lvl-1month { background: var(--warn1); }
  .lvl-expired { background: var(--expired); }
  tr.expired td { color: var(--expired); }
  .del { background: none; border: none; color: var(--muted); cursor: pointer;
         padding: 2px 6px; font-size: 1rem; }
  .del:hover { color: var(--warn1); }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: .75rem; margin-bottom: 14px; }
  .empty { color: var(--muted); font-size: .85rem; padding: 10px 0; }
  .scroll { max-height: 420px; overflow-y: auto; }
</style>
</head>
<body>
<h1>🥫 Emergency Food Storage</h1>
<p class="sub" id="today"></p>

<div class="grid">
  <div class="card">
    <h2>Add product to list</h2>
    <form id="f-product">
      <input id="p-name" placeholder="Product name" required>
      <input id="p-cat" placeholder="Category (optional)">
      <button type="submit">Add</button>
    </form>
    <div class="msg" id="msg-product"></div>
    <h2 style="margin-top:18px">Product list</h2>
    <div class="scroll">
      <table id="t-products"><thead><tr><th>Product</th><th>Category</th><th></th></tr></thead>
      <tbody></tbody></table>
      <div class="empty" id="empty-products" hidden>No products yet.</div>
    </div>
  </div>

  <div class="card">
    <h2>Record a purchase</h2>
    <form id="f-buy">
      <select id="b-product" required></select>
      <input id="b-date" type="date" required>
      <input id="b-qty" type="number" min="1" value="1" style="flex:0;width:70px" title="Quantity">
      <button type="submit">Buy</button>
    </form>
    <div class="msg" id="msg-buy"></div>
    <h2 style="margin-top:18px">Inventory</h2>
    <div class="legend">
      <span class="badge lvl-6months">&lt; 6 months</span>
      <span class="badge lvl-3months">&lt; 3 months</span>
      <span class="badge lvl-1month">&lt; 1 month</span>
      <span class="badge lvl-expired">expired</span>
    </div>
    <div class="scroll">
      <table id="t-inventory"><thead>
        <tr><th>Product</th><th>Qty</th><th>Best before</th><th>Days</th><th></th><th></th></tr>
      </thead><tbody></tbody></table>
      <div class="empty" id="empty-inventory" hidden>Inventory is empty.</div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let DATA = { products: [], inventory: [] };

async function load() {
  const r = await fetch('/api/data');
  DATA = await r.json();
  $('today').textContent = 'Today: ' + DATA.today + ' — items in stock: '
      + DATA.inventory.length;
  render();
}

function render() {
  // product select
  $('b-product').innerHTML = DATA.products.map(p =>
    `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');

  // product table
  const tb = $('t-products').querySelector('tbody');
  tb.innerHTML = DATA.products.map(p =>
    `<tr><td>${esc(p.name)}</td><td>${esc(p.category || '—')}</td>
     <td><button class="del" title="Remove product"
       onclick="delProduct('${esc(p.name)}')">✕</button></td></tr>`).join('');
  $('empty-products').hidden = DATA.products.length > 0;

  // inventory table
  const ti = $('t-inventory').querySelector('tbody');
  ti.innerHTML = DATA.inventory.map(r => {
    const label = r.level === 'ok' ? 'fine' :
      r.level === 'expired' ? 'expired' :
      r.level === '1month' ? '&lt; 1 mo' :
      r.level === '3months' ? '&lt; 3 mo' : '&lt; 6 mo';
    return `<tr class="${r.level === 'expired' ? 'expired' : ''}">
      <td>${esc(r.product)}</td><td>${r.quantity}</td>
      <td>${r.best_before}</td>
      <td>${r.level === 'expired' ? r.days_left + ' (over)' : r.days_left}</td>
      <td><span class="badge lvl-${r.level}">${label}</span></td>
      <td><button class="del" title="Remove item"
        onclick="delItem(${r.id})">✕</button></td></tr>`;
  }).join('');
  $('empty-inventory').hidden = DATA.inventory.length > 0;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function msg(id, text, ok) {
  $(id).textContent = text;
  $(id).className = 'msg ' + (ok ? 'ok' : 'error');
}

async function post(url, body, msgId) {
  const r = await fetch(url, { method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body) });
  const j = await r.json();
  msg(msgId, j.error || 'Saved ✓', !j.error);
  if (!j.error) load();
}

async function del(url) {
  const r = await fetch(url, { method: 'DELETE' });
  const j = await r.json();
  if (j.error) alert(j.error);
  load();
}

window.delItem = id => del('/api/inventory/' + id);
window.delProduct = name => del('/api/products/' + encodeURIComponent(name));

$('f-product').addEventListener('submit', e => {
  e.preventDefault();
  post('/api/products', { name: $('p-name').value, category: $('p-cat').value },
       'msg-product');
  $('p-name').value = ''; $('p-cat').value = '';
});

$('f-buy').addEventListener('submit', e => {
  e.preventDefault();
  post('/api/buy', { product: $('b-product').value,
                     best_before: $('b-date').value,
                     quantity: $('b-qty').value || 1 }, 'msg-buy');
});

load();
setInterval(load, 60000); // refresh every minute
</script>
</body>
</html>
