services:
  food-tracker:
    build:
      context: .
    container_name: food-tracker
    restart: unless-stopped
    ports:
      - "4500:8000"
    volumes:
      - /mnt/apps-mirror/apps-data/emergency-food-tracker/config:/config
      - /mnt/apps-mirror/apps-data/emergency-food-tracker/data:/data
