services:
  food-tracker:
    # Prebuilt image — automatically rebuilt on every push to main
    # via GitHub Actions (.github/workflows/docker-publish.yml).
    # The image name must be lowercase.
    image: ghcr.io/stromming90/emergency-food-tracker:latest
    container_name: food-tracker
    restart: unless-stopped
    ports:
      - "4500:4500"
    environment:
      - PORT=4500
    volumes:
      - /mnt/apps/emergency-food-tracker/config:/config
      - /mnt/apps/emergency-food-tracker/data:/data
